name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        shell: pwsh
        run: |
          python -m pip install build pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-Item dist/*.whl
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Identify a spectrum using the installed package and bundled library
        shell: pwsh
        run: |
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/untargeted_two_local_peaks.mzML'
          Set-Location $env:RUNNER_TEMP
          sphingolipid-identify $fixture --output identified.xlsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -c "import pandas as pd; result = pd.read_excel('identified.xlsx'); assert not result.empty"
      - run: python -m pytest -q
